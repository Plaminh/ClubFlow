name: CI

# Runs the same gate commands as AGENTS.md and HARNESS.md, on every push and pull request.
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The server's variables (server/.env.example). JWT_SECRET is generated per run below.
      # No database yet: the pool connects lazily; a postgres service comes with the database skeleton.
      NODE_ENV: test
      PORT: '3001'
      DATABASE_URL: postgres://clubflow@127.0.0.1:5432/clubflow_test
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: ./uploads
      APP_TODAY: '2026-11-18'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests (client, mock)
        run: npm test

      - name: Install server (as the marker does)
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
