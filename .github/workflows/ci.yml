name: CI

# Runs the same gate commands as AGENTS.md and HARNESS.md, on every push and pull request.
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The marker's database image. Trust auth: no password is written anywhere, and the
      # database exists only inside this CI run. Server tests start from an empty database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clubflow
          POSTGRES_DB: clubflow_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubflow -d clubflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The server's variables (server/.env.example). JWT_SECRET is generated per run below.
      NODE_ENV: test
      PORT: '3001'
      DATABASE_URL: postgres://clubflow@127.0.0.1:5432/clubflow_test
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: ./uploads
      APP_TODAY: '2026-11-18'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests (client, mock)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install server (as the marker does)
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Server tests
        working-directory: server
        run: npm test
